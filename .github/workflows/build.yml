name: Verify and build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - uses: actions/cache@v6
        with:
          path: node_modules/.astro
          key: astro-images-${{ runner.os }}-${{ hashFiles('package-lock.json', 'src/assets/**') }}
          restore-keys: astro-images-${{ runner.os }}-
      - run: npm run format:check
      - run: npm run lint
      - run: npm run check
      - run: npm run build
